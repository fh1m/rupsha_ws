[pytest]
# testpaths keeps collection off colcon's install/ and build/ trees, which would
# otherwise be imported instead of the sources (see conftest.py).
# src/external holds third-party checkouts (ardupilot_gazebo) with their own tests.
testpaths = src test
norecursedirs = src/external build install log .git
python_files = test_*.py
addopts = -p no:anyio -p no:launch_testing -p no:launch_ros
markers =
    sitl: needs a built ArduRover SITL binary (skipped when absent)
    board: needs the real Pixhawk on USB (skipped when absent)
    gazebo: needs gz sim Harmonic + ardupilot_gazebo (skipped when absent)
