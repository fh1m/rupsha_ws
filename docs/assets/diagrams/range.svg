<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img">
  <title>How far a 20 cm ArUco tag is seen</title>
  <rect width="880" height="320" fill="#000000"/>
  <text x="28" y="36" fill="#e4e8ef" font-family="ui-sans-serif, sans-serif" font-size="20">A 20 cm tag, 640 x 480, 70 deg lens</text>
  <text x="28" y="58" fill="#98a2b4" font-family="ui-sans-serif, sans-serif" font-size="13">Gazebo. The rover drives itself. Truth is the camera to the tag face.</text>
  <g font-family="ui-monospace, monospace" font-size="13">
    <text x="28" y="104" fill="#ff5747">8 m / 11 px / never</text>
    <line x1="250" y1="100" x2="810" y2="100" stroke="#ff0000" stroke-width="12" stroke-dasharray="3 7"/>
    <text x="28" y="148" fill="#f88701">6 m / 16 px / flickers</text>
    <line x1="250" y1="144" x2="670" y2="144" stroke="#f88701" stroke-width="12"/>
    <text x="28" y="196" fill="#ff5747">4.5 m / 19 px / +3.6%</text>
    <line x1="250" y1="192" x2="565" y2="192" stroke="#ff0000" stroke-width="16"/>
    <text x="28" y="244" fill="#ff5747">3.0 m / 29 px / +3.0%</text>
    <line x1="250" y1="240" x2="460" y2="240" stroke="#ff0000" stroke-width="16"/>
  </g>
  <line x1="368" y1="78" x2="368" y2="258" stroke="#e4e8ef" stroke-width="1.25"/>
  <text x="368" y="74" text-anchor="middle" fill="#e4e8ef" font-family="ui-monospace, monospace" font-size="11">leg finished / 1.69 m</text>
  <text x="28" y="296" fill="#7b8598" font-family="ui-sans-serif, sans-serif" font-size="12">2026-10-23, camera pitched 17 deg up. 6 m and 8 m are the earlier detection limit.</text>
</svg>
