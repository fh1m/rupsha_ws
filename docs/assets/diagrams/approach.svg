<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img">
  <title>Where the approach stops, side view</title>
  <rect width="880" height="520" fill="#000000"/>
  <text x="28" y="34" fill="#e4e8ef" font-family="ui-sans-serif, sans-serif" font-size="20">Stopping at a post</text>
  <text x="28" y="54" fill="#98a2b4" font-family="ui-sans-serif, sans-serif" font-size="13">Side view, to scale. One headless marker leg, 2026-10-23.</text>
  <line x1="40" y1="430" x2="840" y2="430" stroke="#2b3448" stroke-width="1.5"/>
  <text x="48" y="448" fill="#7b8598" font-family="ui-monospace, monospace" font-size="11">ground</text>
  <line x1="760" y1="430" x2="760" y2="307" stroke="#e4e8ef" stroke-width="6"/>
  <rect x="742" y="271" width="36" height="36" fill="#000000" stroke="#ff0000" stroke-width="2"/>
  <text x="860" y="258" text-anchor="end" fill="#ff5747" font-family="ui-monospace, monospace" font-size="12">tag / 0.88 m</text>
  <text x="760" y="466" text-anchor="middle" fill="#7b8598" font-family="ui-monospace, monospace" font-size="11">post</text>
  <circle cx="490" cy="368" r="7" fill="#ff0000"/>
  <text x="490" y="392" text-anchor="middle" fill="#ff5747" font-family="ui-monospace, monospace" font-size="12">camera / 0.44 m</text>
  <rect x="420" y="356" width="52" height="22" fill="none" stroke="#e4e8ef" stroke-width="1.5"/>
  <text x="446" y="348" text-anchor="middle" fill="#e4e8ef" font-family="ui-monospace, monospace" font-size="11">body</text>
  <line x1="490" y1="368" x2="760" y2="289" stroke="#ff0000" stroke-width="2"/>
  <text x="470" y="330" fill="#ff5747" font-family="ui-monospace, monospace" font-size="12">17 deg up, tag stays in frame</text>
  <line x1="490" y1="368" x2="760" y2="406" stroke="#7b8598" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="500" y="400" fill="#98a2b4" font-family="ui-monospace, monospace" font-size="12">8 deg down, tag left the top of the frame</text>
  <line x1="490" y1="200" x2="760" y2="200" stroke="#e4e8ef" stroke-width="1"/>
  <line x1="490" y1="194" x2="490" y2="206" stroke="#e4e8ef"/>
  <line x1="760" y1="194" x2="760" y2="206" stroke="#e4e8ef"/>
  <text x="625" y="188" text-anchor="middle" fill="#ff5747" font-family="ui-monospace, monospace" font-size="13">1.69 m, camera to the tag face</text>
  <text x="28" y="488" fill="#7b8598" font-family="ui-sans-serif, sans-serif" font-size="12">The board is handed a point 0.5 m from the tag and stops 1.0 m short of it: the 1.5 m standoff.</text>
  <text x="28" y="506" fill="#7b8598" font-family="ui-sans-serif, sans-serif" font-size="12">Verify accepts a tag still in view inside 2.5 m. The body stayed 2.09 m from the post centre.</text>
</svg>
